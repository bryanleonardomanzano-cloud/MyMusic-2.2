name: Build iOS App (unsigned)

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: 'stable'
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Get dependencies
        run: flutter pub get

      - name: Build unsigned IPA (iPhone/arm64)
        run: flutter build ipa --release --no-codesign

      - name: Prepare artifact
        run: |
          mkdir -p artifact
          cp -R build/ios/archive/Runner.xcarchive artifact/Runner.xcarchive || true
          if ls build/ios/ipa/*.ipa 1> /dev/null 2>&1; then
            cp build/ios/ipa/*.ipa artifact/
          fi
          # Fallback: empaquetar Runner.app si no se generó .ipa
          if [ ! -f artifact/*.ipa ] && [ -d build/ios/iphoneos/Runner.app ]; then
            ditto -c -k --sequesterRsrc --keepParent build/ios/iphoneos/Runner.app artifact/Runner-app.zip
          fi

      - name: Upload iOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: MyMusic-iOS-unsigned
          path: artifact
          if-no-files-found: error
          retention-days: 14